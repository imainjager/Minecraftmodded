<!doctype html>
<html><head><meta charset="utf-8"><title>mobforge preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#111;color:#ddd;font:13px system-ui,sans-serif;overflow:hidden}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  #bar{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#000a;padding:6px 8px;border-radius:6px}
  select,button,input{font:inherit}
  #t{width:160px}
  #atlasview{display:none;position:absolute;right:8px;top:48px;max-width:46%;max-height:80%;image-rendering:pixelated;background:#f0f;border:2px solid #fff}
  #info{opacity:.7}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <label>animation <select id="anim"></select></label>
  <label>phase <select id="phase"></select></label>
  <label>view <select id="view"></select></label>
  <button id="play">pause</button>
  <label>speed <input id="speed" type="range" min="0.1" max="2" step="0.1" value="1"></label>
  <label>time <input id="t" type="range" min="0" max="6" step="0.01" value="0"></label>
  <button id="atlas">texture</button>
  <span id="info"></span>
</div>
<img id="atlasview">
<script src="app.js"></script>
</body></html>
